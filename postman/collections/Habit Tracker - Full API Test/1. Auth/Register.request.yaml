$kind: http-request
url: "{{base_url}}/accounts/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"username": "testuser1", "email": "testuser1@example.com", "password": "Test@12345"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 (created) or 400 (already exists)", () => { pm.expect([201, 400]).to.include(pm.response.code); });
      if (pm.response.code === 201) { console.log("user created"); }
    language: text/javascript
order: 1000
